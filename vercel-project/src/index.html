                            <button type="button" onclick="Dash.addProdImageInput()" class="mt-2 text-xs font-bold text-primary hover:bg-blue-50 dark:hover:bg-blue-900/30 px-2.5 py-1.5 rounded-lg transition-colors inline-flex items-center gap-1">+ Tambah Foto</button>
                        </div>

                        <div><label class="block text-xs font-semibold mb-1 text-mute">Deskripsi</label><textarea id="fp-desc" rows="4" required class="w-full p-2.5 border rounded-xl bg-transparent outline-none focus:border-primary text-sm text-main">${Utils.escapeHTML(d.description||'')}</textarea></div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div><label class="block text-xs font-semibold mb-1 text-mute">URL Demo (Opsional)</label><input type="url" id="fp-demo" value="${Utils.escapeHTML(d.demo_url||'')}" placeholder="Kosongkan jika tidak ada" class="w-full p-2.5 border rounded-xl bg-transparent outline-none focus:border-primary text-sm text-main"></div><div><label class="block text-xs font-semibold mb-1 text-mute">URL Beli (Opsional)</label><input type="url" id="fp-buy" value="${Utils.escapeHTML(d.purchase_url||'')}" placeholder="Kosongkan untuk WA" class="w-full p-2.5 border rounded-xl bg-transparent outline-none focus:border-primary text-sm text-main"></div></div>
                        <div class="text-right pt-2"><button type="submit" class="bg-primary text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-blue-600 shadow-sm w-full sm:w-auto">Simpan</button></div>
                    </form>
                `);
            },
            async saveProd(e, id) {
                e.preventDefault(); 
                const imgInputs = document.querySelectorAll('#fp-images-wrapper .fp-multi-img');
                const imagesArr = [];
                imgInputs.forEach(inp => { if(inp.value.trim()) imagesArr.push(Utils.toDriveThumbnail(inp.value.trim())); });
                if (imagesArr.length === 0) return Notify.show('Pilih minimal 1 foto produk', 'error');
                const normalPrice = Number(document.getElementById('fp-oprice').value || 0);
                const salePrice = Number(document.getElementById('fp-price').value || 0);
                const promoEndValue = document.getElementById('fp-promo-end').value;
                if (promoEndValue && normalPrice <= salePrice) return Notify.show('Harga normal harus lebih tinggi dari harga promo.', 'error');
                if (promoEndValue && new Date(promoEndValue).getTime() <= Date.now()) return Notify.show('Waktu berakhir promo harus di masa mendatang.', 'error');

                let p = { 
                    id: id || 'PRD-'+Date.now(), 
                    name: document.getElementById('fp-name').value.trim(), 
                    category_id: document.getElementById('fp-cat').value, 
                    description: document.getElementById('fp-desc').value, 
                    short_description: document.getElementById('fp-desc').value, 
                    original_price: document.getElementById('fp-oprice').value, 
                    price: document.getElementById('fp-price').value,
                    promo_label: document.getElementById('fp-promo-label').value.trim() || 'PROMO',
                    promo_end_at: document.getElementById('fp-promo-end').value,
                    demo_url: document.getElementById('fp-demo').value.trim(), 
                    purchase_url: document.getElementById('fp-buy').value.trim(), 
                    images: imagesArr, 
                    status: 'active', featured: true, 
                    is_popular: id ? (this.data.products.find(x => x.id === id)?.is_popular || false) : false 
                };
                State.updateLocal('products', p.id, p, 'save'); this.data.products = State.public.products; this.view('products', false); Modal.close(); Notify.show('Produk disimpan', 'success'); API.req('saveProduct', p);
            },

            renderBanContent(container) {
                const list = this.data.banners || [];
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-4 gap-3"><h2 class="font-bold text-main text-sm">Banner Utama</h2><button onclick="Dash.formBan()" class="bg-primary text-white px-4 py-2 rounded-full text-xs font-bold hover:bg-blue-600 shadow-sm">+ Banner Baru</button></div>
                    ${list.length === 0 ? `<div class="surface-el rounded-[20px] border p-8 text-center text-xs text-mute">Belum ada banner</div>` : `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${list.map(x => {
                            const isSel = this.selectedIds.has(x.id);
                            return `<div onclick="Dash.toggleSelect('${x.id}', 'banners')" class="surface-el border rounded-[20px] p-3.5 shadow-sm relative cursor-pointer select-none transition-all ${isSel ? 'ring-2 ring-primary border-primary bg-blue-50/40 dark:bg-blue-900/15' : ''}"><div class="absolute top-5 left-5 z-10 w-7 h-7 rounded-lg bg-white/90 dark:bg-black/70 flex items-center justify-center shadow"><i class="ph ${isSel ? 'ph-check-square text-primary font-bold' : 'ph-square text-mute'} text-[18px]"></i></div><img src="${Utils.sanitizeURL(x.image_url)}" class="w-full aspect-[21/9] object-cover rounded-[14px] mb-2.5 border"><p class="font-bold text-xs truncate mb-1 text-main">${Utils.escapeHTML(x.title)}</p><div class="flex gap-2 mt-2.5" onclick="event.stopPropagation()"><button onclick="Dash.formBan('${x.id}')" class="flex-1 py-1.5 text-[11px] font-bold border border-blue-200 text-blue-500 rounded-lg">Ubah</button><button onclick="Dash.confirmDel('deleteBanner','${x.id}', 'banners')" class="flex-1 py-1.5 text-[11px] font-bold border border-red-200 text-red-500 rounded-lg">Hapus</button></div></div>`;
                        }).join('')}
                    </div>`}
                    ${this.renderBulkBar('banners', 'deleteBanner')}`;
            },
            formBan(id = null) {
                let d = id ? this.data.banners.find(x => x.id === id) : { title:'', image_url:'', target_url:'none', status:'active' };
                Modal.open(id ? 'Ubah Banner' : 'Tambah Banner', `
                    <form onsubmit="Dash.saveBan(event, '${id||''}')" class="space-y-3.5">
                        <div><label class="block text-xs font-semibold mb-1 text-mute">Judul Banner</label><input id="fb-title" value="${Utils.escapeHTML(d.title)}" required class="w-full p-2.5 border rounded-xl bg-transparent outline-none focus:border-primary text-sm text-main"></div>
                        <div>
                            <label class="block text-xs font-semibold mb-1 text-mute">Gambar Banner</label>
                            ${this.buildUploadBoxHTML('fb-img-url', d.image_url, false)}
                        </div>
                        <div><label class="block text-xs font-semibold mb-1 text-mute">Aksi Klik</label><select id="fb-type" onchange="Dash.banChangeType()" class="w-full p-2.5 border rounded-xl bg-transparent outline-none text-main text-sm"><option value="none" ${d.target_url==='none'?'selected':''}>Tanpa Aksi</option><option value="custom" ${d.target_url.startsWith('http')?'selected':''}>Buka URL</option><option value="category" ${(this.data.categories||[]).find(c=>c.name===d.target_url)?'selected':''}>Buka Kategori</option><option value="product" ${d.target_url.startsWith('PRD-')?'selected':''}>Buka Produk</option></select></div>
                        <div id="fb-target-wrap" class="${d.target_url==='none'?'hidden':''}"><label class="block text-xs font-semibold mb-1 text-mute" id="fb-target-lbl">Tujuan</label><div id="fb-target-input"></div></div>
                        <div class="text-right pt-2"><button type="submit" class="bg-primary text-white px-5 py-2.5 rounded-xl text-sm font-semibold w-full sm:w-auto">Simpan</button></div>
                    </form>
                `);
                this.banChangeType(d.target_url);
            },
            banChangeType(initVal = null) {
                const type = document.getElementById('fb-type').value; const w = document.getElementById('fb-target-wrap'); const i = document.getElementById('fb-target-input'); const l = document.getElementById('fb-target-lbl');
                if (type === 'none') { w.classList.add('hidden'); i.innerHTML = `<input id="fb-val" type="hidden" value="none">`; } 
                else { 
                    w.classList.remove('hidden'); 
                    if (type === 'custom') { l.textContent = 'Masukkan URL'; i.innerHTML = `<input id="fb-val" type="url" value="${Utils.escapeHTML(initVal&&initVal.startsWith('http')?initVal:'')}" required class="w-full p-2.5 border rounded-xl bg-transparent outline-none text-sm text-main">`; }
                    else if (type === 'category') { l.textContent = 'Pilih Kategori'; i.innerHTML = `<select id="fb-val" class="w-full p-2.5 border rounded-xl bg-transparent outline-none text-sm text-main">${(this.data.categories||[]).map(c=>`<option value="${c.name}" ${initVal===c.name?'selected':''}>${Utils.escapeHTML(c.name)}</option>`).join('')}</select>`; }
                    else if (type === 'product') { l.textContent = 'Pilih Produk'; i.innerHTML = `<select id="fb-val" class="w-full p-2.5 border rounded-xl bg-transparent outline-none text-sm text-main">${(this.data.products||[]).map(p=>`<option value="${p.id}" ${initVal===p.id?'selected':''}>${Utils.escapeHTML(p.name)}</option>`).join('')}</select>`; }
                }
            },
            async saveBan(e, id) {
                e.preventDefault();
                const imgVal = document.getElementById('fb-img-url').value.trim();
                if (!imgVal) return Notify.show('Pilih gambar banner terlebih dahulu', 'error');
                let p = { id: id || 'BAN-'+Date.now(), title: document.getElementById('fb-title').value.trim(), image_url: Utils.toDriveThumbnail(imgVal), target_url: document.getElementById('fb-val').value, status: 'active', subtitle: '' };
                State.updateLocal('banners', p.id, p, 'save'); this.data.banners = State.public.banners; this.view('banners', false); Modal.close(); Notify.show('Banner tersimpan', 'success'); API.req('saveBanner', p);
            },

            renderPopupContent(container) {
                const s = this.data.settings || {};
                container.innerHTML = `
                    <div class="surface-el p-5 rounded-[20px] border shadow-sm max-w-xl mx-auto">
                        <form onsubmit="Dash.savePopup(event)" class="space-y-4">
                            <div><label class="block text-xs font-semibold mb-1.5 text-mute">Status Pop-up</label><select id="fpop-status" class="w-full p-2.5 border rounded-xl bg-transparent outline-none text-sm text-main"><option value="active" ${s.popup_status==='active'?'selected':''}>Aktif</option><option value="inactive" ${s.popup_status!=='active'?'selected':''}>Nonaktif</option></select></div>
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-mute">Poster Pop-up</label>
                                ${this.buildUploadBoxHTML('fpop-url-img', s.popup_image_url || '', false, true)}
                            </div>
                            <div><label class="block text-xs font-semibold mb-1.5 text-mute">URL Tujuan Klik (Opsional)</label><input id="fpop-url-targ" type="url" value="${Utils.escapeHTML(s.popup_target_url||'')}" placeholder="https://" class="w-full p-2.5 border rounded-xl bg-transparent outline-none text-sm text-main"></div>
                            <div class="flex gap-2.5 pt-2">
                                <button type="button" onclick="Dash.testPopup()" class="bg-gray-100 dark:bg-gray-800 text-main px-4 py-2.5 rounded-xl text-xs font-bold w-1/2">Pratinjau</button>
                                <button type="submit" class="bg-primary text-white px-4 py-2.5 rounded-xl text-xs font-bold w-1/2">Simpan</button>
                            </div>
                        </form>
                    </div>`;
            },
            testPopup() {
                const img = document.getElementById('fpop-url-img').value.trim();
                if(!img) return Notify.show('Pilih gambar poster terlebih dahulu', 'error');
                Modal.open('Pratinjau Pop-up', `<div class="flex justify-center p-2 bg-black/60 rounded-2xl"><img src="${Utils.sanitizeURL(img)}" class="max-w-full max-h-[60vh] object-contain rounded-xl"></div>`);
            },
            async savePopup(e) {
                e.preventDefault();
                const rawImg = document.getElementById('fpop-url-img').value.trim();
                let p = { 
                    target_url: document.getElementById('fpop-url-targ').value.trim(), 
                    status: document.getElementById('fpop-status').value, 
                    image_url: rawImg ? Utils.toDriveThumbnail(rawImg) : '' 
                };
                if (!this.data.settings) this.data.settings = {};
                this.data.settings = {
                    ...State.public.store,
                    ...this.data.settings,
                    popup_status: p.status,
                    popup_image_url: p.image_url,
                    popup_target_url: p.target_url
                };
                State.public.store = this.data.settings;
                localStorage.setItem('mir_cache_store', JSON.stringify(State.public));
                Notify.show('Pop-up tersimpan', 'success');
                API.req('savePopup', p);
            },

            renderSetContent(container) {
                const s = { ...State.public.store, ...(this.data.settings || {}) };
                const lgLight = s.logo_light_url ? Utils.toDriveThumbnail(s.logo_light_url) : '';
                const lgDark = s.logo_dark_url ? Utils.toDriveThumbnail(s.logo_dark_url) : '';
                const lgApp = s.app_logo_url ? Utils.toDriveThumbnail(s.app_logo_url) : '';

                container.innerHTML = `
                    <div class="max-w-xl mx-auto space-y-5 pb-10">
                        <form onsubmit="Dash.saveSet(event)">
                            <div class="surface-el p-5 rounded-[20px] border shadow-sm mb-4 space-y-3.5">
                                <h3 class="font-bold text-main text-sm flex items-center gap-2 border-b dark:border-gray-800 pb-2.5"><i class="ph ph-storefront text-[18px] text-primary"></i> Identitas Toko & WhatsApp</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div><label class="block text-[11px] font-semibold mb-1 text-mute">Nama Toko</label><input id="fs-name" value="${Utils.escapeHTML(s.store_name||'')}" placeholder="MIR Digital Store" class="w-full p-2.5 border rounded-xl bg-transparent outline-none text-sm text-main"></div>
                                    <div><label class="block text-[11px] font-semibold mb-1 text-mute">Tagline</label><input id="fs-tag" value="${Utils.escapeHTML(s.store_tagline||'')}" placeholder="Opsional" class="w-full p-2.5 border rounded-xl bg-transparent outline-none text-sm text-main"></div>
                                </div>
                                <div><label class="block text-[11px] font-semibold mb-1 text-mute">Nomor WA Order (6281...)</label><input type="text" inputmode="numeric" id="fs-wa" value="${Utils.escapeHTML(s.whatsapp_number||'')}" placeholder="628123456789" class="w-full p-2.5 border rounded-xl bg-transparent outline-none text-sm text-main"></div>
                                <div><label class="block text-[11px] font-semibold mb-1 text-mute">Format Pesan WA ([nama_produk] & [harga])</label><textarea id="fs-wamsg" rows="2" placeholder="Opsional" class="w-full p-2.5 border rounded-xl bg-transparent outline-none text-sm text-main">${Utils.escapeHTML(s.whatsapp_message||'')}</textarea></div>
                            </div>

                            <div class="surface-el p-5 rounded-[20px] border shadow-sm mb-4 space-y-3.5">
                                <h3 class="font-bold text-main text-sm flex items-center gap-2 border-b dark:border-gray-800 pb-2.5"><i class="ph ph-image text-[18px] text-primary"></i> Logo & Ikon Aplikasi</h3>
                                <div>
                                    <label class="block text-[11px] font-semibold mb-1 text-mute">Logo Toko (Mode Terang)</label>
                                    ${this.buildUploadBoxHTML('fs-logo-light', lgLight, false, true)}
                                </div>
                                <div>
                                    <label class="block text-[11px] font-semibold mb-1 text-mute">Logo Toko (Mode Gelap)</label>
                                    ${this.buildUploadBoxHTML('fs-logo-dark', lgDark, false, true)}
                                </div>
                                <div>
                                    <label class="block text-[11px] font-semibold mb-1 text-mute">Nama Aplikasi</label>
                                    <input id="fs-app-name" value="${Utils.escapeHTML(s.app_name||'')}" placeholder="Opsional" class="w-full p-2.5 border rounded-xl bg-transparent outline-none text-sm text-main mb-3">
                                    <label class="block text-[11px] font-semibold mb-1 text-mute">Ikon Aplikasi</label>
                                    ${this.buildUploadBoxHTML('fs-app-logo', lgApp, false, true)}
                                </div>
                            </div>
                            <div class="text-right"><button type="submit" class="bg-primary text-white px-6 py-3 rounded-xl text-sm font-bold w-full sm:w-auto shadow-md">Simpan Pengaturan</button></div>
                        </form>
                    </div>
                `;
            },
            async saveSet(e) { 
                e.preventDefault(); 
                const rawLight = document.getElementById('fs-logo-light').value.trim();
                const rawDark = document.getElementById('fs-logo-dark').value.trim();
                const rawAppLogo = document.getElementById('fs-app-logo').value.trim();
                const p = { 
                    store_name: document.getElementById('fs-name').value.trim(), 
                    store_tagline: document.getElementById('fs-tag').value.trim(), 
                    whatsapp_number: document.getElementById('fs-wa').value.trim(), 
                    whatsapp_message: document.getElementById('fs-wamsg').value,
                    logo_light_url: rawLight ? Utils.toDriveThumbnail(rawLight) : '', 
                    logo_dark_url: rawDark ? Utils.toDriveThumbnail(rawDark) : '', 
                    app_name: document.getElementById('fs-app-name').value.trim(), 
                    app_logo_url: rawAppLogo ? Utils.toDriveThumbnail(rawAppLogo, 'w512') : ''
                };
                this.data.settings = { ...State.public.store, ...(this.data.settings || {}), ...p };
                State.public.store = this.data.settings;
                localStorage.setItem('mir_cache_store', JSON.stringify(State.public));
                PWAManager.updateManifest(this.data.settings);
                Notify.show('Pengaturan disimpan', 'success');
                Theme.apply(document.documentElement.classList.contains('dark'));
                API.req('saveSettings', p);
            },

            confirmDel(action, id, localKey) {
                Modal.open('Konfirmasi Hapus', `<div class="text-center p-3"><i class="ph ph-warning text-[48px] text-red-500 mx-auto mb-3"></i><p class="text-main mb-5 font-bold text-sm">Yakin menghapus data ini?</p><div class="flex gap-2.5 justify-center"><button onclick="Modal.close()" class="px-4 py-2.5 bg-gray-100 dark:bg-gray-800 text-main font-bold rounded-xl w-1/2 text-xs">Batal</button><button onclick="Dash.executeDel('${action}', '${id}', '${localKey}')" class="px-4 py-2.5 bg-red-500 text-white font-bold rounded-xl w-1/2 text-xs">Hapus</button></div></div>`);
            },
            async executeDel(action, id, localKey) { 
                this.selectedIds.delete(id);
                State.updateLocal(localKey, id, null, 'delete'); this.data[localKey] = State.public[localKey];
                this.view(localKey, false); Modal.close(); Notify.show('Data dihapus', 'success'); API.req(action, { id }); 
            },

            confirmBulkDel(action, localKey) {
                const count = this.selectedIds.size;
                if (count === 0) return;
                Modal.open('Konfirmasi Hapus Massal', `<div class="text-center p-3"><i class="ph ph-warning text-[48px] text-red-500 mx-auto mb-3"></i><p class="text-main mb-5 font-bold text-sm">Yakin menghapus ${count} data yang dipilih?</p><div class="flex gap-2.5 justify-center"><button onclick="Modal.close()" class="px-4 py-2.5 bg-gray-100 dark:bg-gray-800 text-main font-bold rounded-xl w-1/2 text-xs">Batal</button><button onclick="Dash.executeBulkDel('${action}', '${localKey}')" class="px-4 py-2.5 bg-red-500 text-white font-bold rounded-xl w-1/2 text-xs">Hapus (${count})</button></div></div>`);
            },
            async executeBulkDel(action, localKey) {
                const ids = Array.from(this.selectedIds);
                if (ids.length === 0) return;
                this.selectedIds.clear();
                State.updateLocal(localKey, ids, null, 'deleteBatch');
                this.data[localKey] = State.public[localKey];
                this.view(localKey, false);
                Modal.close();
                Notify.show(`${ids.length} data dihapus`, 'success');
                API.req('deleteBatch', { sheetKey: localKey, ids: ids });
            }
        };

        window.addEventListener('popstate', () => Router.load());
        window.addEventListener('DOMContentLoaded', () => { 
            PWAManager.init(); Theme.init(); Router.load(); PublicUI.startPromoClock();
            document.addEventListener('click', (e) => { const wrap = document.getElementById('searchWrap'); const dd = document.getElementById('searchDropdown'); if(wrap && dd && !wrap.contains(e.target)) { dd.classList.add('hidden'); dd.classList.remove('flex'); } });
            document.addEventListener('contextmenu', (e) => { if (e.target && e.target.tagName === 'IMG') e.preventDefault(); });
            document.addEventListener('dragstart', (e) => { if (e.target && e.target.tagName === 'IMG') e.preventDefault(); });
        });
    </script>
</body>
</html>
